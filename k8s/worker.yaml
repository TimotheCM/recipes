apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app: worker
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: timothecm/recipes-worker
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: recipes-config
            - secretRef:
                name: recipes-secret
